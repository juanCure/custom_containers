server {
    listen 80;
    server_name changeMeWithJournalDomain;

    # Activating gzip but do NOT compress HTML (prevents BREACH)
    gzip off;
    #gzip_vary on;
    #gzip_min_length 1024;
    # only compress static assets; intentionally exclude text/html
    #gzip_types
    #    application/javascript
    #    application/x-javascript
    #    text/javascript
    #    text/css
    #    application/json
    #    application/xml
    #    image/svg+xml
    #    font/woff2
    #    font/woff
    #    application/font-woff
    #    application/vnd.ms-fontobject
    #    application/octet-stream;

    # Remove Accept-Encoding when proxying so backend doesn't compress
    proxy_set_header Accept-Encoding "";

    # Activar ModSecurity
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/modsecurity.conf;

    location / {

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # MUY IMPORTANTE: INFORMAR A OJS SI LA PETICIÓN ORIGINAL FUE HTTPS
        proxy_set_header X-Forwarded-Proto https;
        # Reenvía cadena completa de proxies (balanceador → nginx → apache)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Host "changeMeWithJournalDomain";
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_pass http://changeMeWithDockerAppContainerName:80;

        # Agregando encabezados de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';";
        # Agregando no-transform para evitar que proxies o balanceadores apliquen compresión
        add_header Cache-Control "no-store, no-transform" always;


        # Complementando: Estableciendo los encabezados que podrían ser inyectados con el dominio permitido
        proxy_set_header X-Host "changeMeWithJournalDomain";
        proxy_set_header X-Forwarded-Server "changeMeWithJournalDomain";

        # Adding support flag Secure to Cookies in general
        proxy_cookie_flags ~ Secure HttpOnly SameSite=Strict;

        # CORS (si es necesario)
        add_header 'Access-Control-Allow-Origin' 'http://changeMeWithJournalDomain';

    }
}

# Bloque de fallback (catch-all)
server {
    listen 80 default_server;
    server_name _;

    #return 444;   # Cierra la conexión sin responder
    # O alternativamente:
    return 400 "The Host header is invalid, the connection will be closed\n";
}
